<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Bujhi">
  <!-- Bujhi (বুঝি): a card-stock speech bubble that translates, English <-> Bangla. -->
  <defs>
    <clipPath id="sq"><rect x="6" y="6" width="116" height="116" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="6" y="6" width="116" height="116" fill="#22a06b"/>
    <rect x="6" y="6" width="116" height="116" fill="#ffffff" opacity="0.10"/>
    <!-- card-stock bottom edge -->
    <rect x="6" y="104" width="116" height="18" fill="#0f7a4f"/>
  </g>
  <!-- white speech bubble with a tail bottom-left -->
  <path d="M34 28h60a14 14 0 0 1 14 14v34a14 14 0 0 1-14 14H52l-15 13a3 3 0 0 1-5-2.3V90h-1A12 12 0 0 1 20 78V42a14 14 0 0 1 14-14z" fill="#fdfcf6"/>
  <!-- translate swap: top arrow (green) points right, bottom arrow (coral) points left -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 52h44m-11-9 11 9-11 9" stroke="#0f7a4f"/>
    <path d="M90 70H46m11-9-11 9 11 9" stroke="#ec5340"/>
  </g>
</svg>
